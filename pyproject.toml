[project]
name = "card-suite"
version = "0.1.0"
description = "Shared architecture for poker/bridge/Court Piece bots: engine, persona model, evaluation harness."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "games", "review", "api"]

# uv's default "clone" link mode (macOS APFS clonefile) was observed propagating the
# filesystem's hidden flag onto the generated editable-install .pth file on this
# machine, which CPython's site module silently skips - breaking `import engine`/
# `import games` in any script invoked directly (python scripts/foo.py), while `-c`
# and `-m` kept working by luck (their sys.path[0] happens to resolve to the cwd).
# Plain byte copying doesn't carry that flag over, so pin it rather than rely on the
# platform-dependent default.
[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "games"]
addopts = "-m 'not slow'"
markers = [
    "slow: computationally expensive tests (real persona matchups) - run explicitly with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine", "games", "review", "api", "tests"]
