[project]
name = "card-suite"
version = "0.1.0"
description = "Shared architecture for poker/bridge/Court Piece bots: engine, persona model, evaluation harness."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "games"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine", "games", "review", "api", "tests"]
